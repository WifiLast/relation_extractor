# systemd drop-in for an already-installed z3-backend-mcp.service:
#   sudo install -D -m644 z3-backend-mcp-l5.conf /etc/systemd/system/z3-backend-mcp.service.d/l5.conf
#   sudo systemctl daemon-reload && sudo systemctl restart z3-backend-mcp
# The L5 relation models (ReLiK/GLiREL) load via the Hugging Face cache,
# which ProtectSystem=strict would otherwise leave read-only.
[Service]
ReadWritePaths=/home/wiffzack/.cache/huggingface
