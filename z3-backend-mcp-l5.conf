# systemd drop-in for an already-installed z3-backend-mcp.service:
#   sudo install -D -m644 z3-backend-mcp-l5.conf /etc/systemd/system/z3-backend-mcp.service.d/l5.conf
#   sudo systemctl daemon-reload && sudo systemctl restart z3-backend-mcp
[Unit]
# network.target doesn't wait for DNS; Hub lookups at boot failed with
# "Temporary failure in name resolution".
After=network-online.target

[Service]
# The L5 relation models (ReLiK/GLiREL) load via the Hugging Face cache,
# which ProtectSystem=strict would otherwise leave read-only.
ReadWritePaths=/home/wiffzack/.cache/huggingface
# ~/.local/lib/python3.10 holds an old torch 2.6 (rocm6.2.4) that shadows the
# env's torch when the user site is enabled; the interactive shell exports
# this, systemd doesn't. Without it the L5 models fail to load
# (torchaudio: undefined symbol aoti_torch_abi_version).
Environment="PYTHONNOUSERSITE=1"
# All ReLiK/GLiREL models are cached; don't hit the Hub on every start.
Environment="HF_HUB_OFFLINE=1"
